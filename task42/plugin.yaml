manifest_version: 2
name: task42
version: 1.0.2
description: >
  The built-in Task session, extracted into a first-party plugin. Provides
  the task42 workflow (Planning -> In-Progress -> Testing -> Human Review ->
  Done), the task session type, the spec/subtasks/qa/testing-plan widgets,
  a "New Task" create-intent, and an onCreate hook that seeds the linked
  To-Do. A reference conversion: declarative workflow + session type + intent
  and a compiled session hook.
author: work42
sdk_version: 2.9.0
sdk_abi: 14
requires: [github]
