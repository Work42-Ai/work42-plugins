manifest_version: 2
name: firebase
version: 0.2.1
description: >
  Firebase Console widgets for Work42: Authentication, Analytics, Firestore and Crashlytics, each its own
  widget with its official Firebase icon, showing that product's live Console pages with one browser tab per
  project. A small floating Projects button opens a selection window (projects come from
  `firebase projects:list`) and saves the list to ~/.work42/firebase/config.json, shared by every Firebase
  widget. Firebase Console links open the matching widget on the right project tab. Bundles a setup skill, a
  global using-firebase index, and one skill per product describing what the Firebase CLI can and cannot do
  for it.
author: work42
sdk_version: 2.6.4
sdk_abi: 12
requires: []
global_skills: using-firebase
