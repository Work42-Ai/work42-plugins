manifest_version: 2
name: figma
version: 1.0.0
description: >
  Figma integration for Work42. Provides the Figma file browser widget (one tab
  per attached figma.com link, sharing the "browser" cookie jar) plus a
  widget-figma skill, scoped to sessions with the active widget, that explains
  how to read the attached links from storage
  and — for design data — how to enable Figma through the agent's own connector.
  Also bundles Figma's own figma-use, figma-generate-design and figma-create-new-file
  guides and references, loaded through the widget skill, for building in a file
  through that connector.
  work42 does NOT inject a Figma MCP: Figma's MCP is restricted to clients on
  Figma's approved MCP Catalog, so the agent (e.g. Claude, an approved client)
  connects it via its own connector settings instead.
author: work42
sdk_version: 2.3.0
sdk_abi: 12
requires: []
